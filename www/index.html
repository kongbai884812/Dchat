<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Dchat</title><meta content="1.0" name="application-version"><script defer src="static/js/main.9820cd3a.js"></script><link href="static/css/main.7361e32c.css" rel="stylesheet"></head><body><div id="root"></div>
<script src="camera.js" defer></script>
<!-- ↓↓↓ 仅为排障加的，稳定后整段删掉即可 ↓↓↓ -->
<script>
(function () {
  var errs = [];
  window.addEventListener("error", function (e) {
    errs.push((e.message || "error") + " @ " + (e.filename || "") + ":" + (e.lineno || ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    errs.push("promise: " + (e.reason && (e.reason.message || e.reason)));
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.childElementCount === 0) {
      var box = document.createElement("div");
      box.style.cssText = "position:fixed;inset:0;z-index:2147483646;background:#fff;color:#222;padding:22px;font:13px/1.75 system-ui,-apple-system,sans-serif;overflow:auto";
      var pre = document.createElement("pre");
      pre.style.cssText = "white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px;font-size:12px";
      pre.textContent = errs.join("\n") || "没有捕获到脚本错误（可能卡在资源加载）";
      box.innerHTML = '<h3 style="margin:0 0 8px">页面没有渲染出来</h3><p style="color:#666;margin:0 0 10px">origin: <code>' +
        location.origin + "</code>　协议: <code>" + location.protocol + "</code></p>";
      box.appendChild(pre);
      box.insertAdjacentHTML("beforeend", '<p><a href="diag.html" style="color:#4d6bfe">→ 打开诊断页</a></p>');
      document.body.appendChild(box);
    }
  }, 6000);
})();
</script>

<!-- DIAG-START -->
<script>
(function () {
  var ICON =
    '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="9.2"/>' +
    '<path d="M9.4 9.2a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.1-2.6 3.7"/>' +
    '<circle cx="12" cy="17.1" r="0.95" fill="currentColor" stroke="none"/></svg>';

  function findRow(el) {
    var cur = el, depth = 0;
    while (cur.parentElement && depth++ < 6) {
      var w = cur.parentElement.getBoundingClientRect().width;
      if (w >= window.innerWidth * 0.85) return cur.parentElement;
      cur = cur.parentElement;
    }
    return el.parentElement;
  }

  /* ---- 诊断页：同页浮层，不卸载 React 应用 ---- */
  var overlay = null, frame = null, loaded = false;

  function buildOverlay() {
    overlay = document.createElement("div");
    overlay.id = "__diag_overlay";
    overlay.style.cssText =
      "position:fixed;inset:0;z-index:2147483646;background:#0f1115;" +
      "display:flex;flex-direction:column;transform:translateY(100%);" +
      "transition:transform .18s ease-out;will-change:transform";

    frame = document.createElement("iframe");
    frame.setAttribute("allow", "clipboard-write");
    frame.style.cssText = "flex:1;width:100%;border:0;background:#0f1115";
    overlay.appendChild(frame);
    document.body.appendChild(overlay);

    frame.addEventListener("load", function () { loaded = true; });
  }

  function openDiag() {
    try { window.NativeShell && window.NativeShell.setModal(1); } catch (e) {}
    if (!overlay) buildOverlay();
    if (!loaded) frame.src = "diag.html";
    overlay.style.display = "flex";
    requestAnimationFrame(function () {
      overlay.style.transform = "translateY(0)";
    });
  }

  function closeDiag() {
    try { window.NativeShell && window.NativeShell.setModal(0); } catch (e) {}
    if (!overlay) return;
    overlay.style.transform = "translateY(100%)";
    setTimeout(function () { overlay.style.display = "none"; }, 180);
  }

  window.__openDiag = openDiag;
  window.__closeDiag = closeDiag;

  function mount() {
    if (document.getElementById("__diag_btn")) return;
    var menu = document.querySelector('[aria-label="打开边栏"]');
    if (!menu || !menu.parentElement) return;

    var row = findRow(menu);
    if (!row) return;

    var a = document.createElement("button");
    a.id = "__diag_btn";
    a.type = "button";
    a.setAttribute("aria-label", "诊断");
    a.innerHTML = ICON;
    a.style.cssText =
      "display:inline-flex;align-items:center;justify-content:center;" +
      "width:44px;height:44px;flex:none;margin-left:auto;margin-right:4px;" +
      "background:none;border:0;color:inherit;padding:0;opacity:.85;" +
      "-webkit-tap-highlight-color:transparent";
    a.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openDiag();
    });
    row.appendChild(a);
  }

  // 不用无限轮询：React 首次挂载通常在 3s 内完成，
  // 之后只在页面重新可见时补挂一次，省电也省 CPU。
  function boot() {
    mount();
    var tries = 0;
    (function retry() {
      if (document.getElementById("__diag_btn")) return;
      mount();
      if (++tries < 12) setTimeout(retry, 400 + tries * 300);
    })();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && !document.getElementById("__diag_btn")) mount();
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!-- DIAG-END -->
<!-- ↑↑↑ 排障段结束 ↑↑↑ -->
</body></html>
