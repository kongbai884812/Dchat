<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>聊天记录 ZIP 自检</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#242a35;--fg:#e8ecf3;--dim:#8b95a7;
        --ok:#3ddc84;--bad:#ff6b6b;--warn:#ffb454;--accent:#4d6bfe}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);padding:16px 14px 28px;
       font:14px/1.65 -apple-system,"HarmonyOS Sans","Noto Sans SC",system-ui,sans-serif}
  h1{font-size:17px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .pick{display:block;width:100%;padding:14px;border-radius:12px;border:1px dashed var(--line);
        background:var(--panel);color:var(--fg);text-align:center;font-size:14px;margin-bottom:14px}
  .verdict{border-radius:10px;padding:12px 13px;margin:0 0 14px;font-size:13.5px;
           white-space:pre-wrap;background:var(--panel);border-left:3px solid var(--accent)}
  .verdict.ok{border-left-color:var(--ok)}
  .verdict.bad{border-left-color:var(--bad)}
  .verdict.warn{border-left-color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td{padding:6px 4px;border-bottom:1px solid var(--line);word-break:break-all;vertical-align:top}
  td:first-child{color:var(--dim);width:42%}
  pre{background:#12151b;border:1px solid var(--line);border-radius:10px;padding:10px;
      font-size:11.5px;overflow:auto;max-height:260px;white-space:pre-wrap}
  .q{color:var(--dim);font-size:12px;margin-top:12px}
</style>
</head>
<body>
<h1>聊天记录 ZIP 自检</h1>
<div class="sub">选中你从 DeepSeek 导出的 ZIP，这里会告诉你它能不能被这个 demo 导入。</div>

<label class="pick" for="f">点这里选择 ZIP 文件</label>
<input id="f" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden />

<div class="verdict" id="verdict">等待选择文件…</div>
<table id="rows"></table>
<div class="q">demo 只认这种结构：<code>manifest.json</code>（含 <code>export_format_version: 3</code>）、<code>user.json</code>、<code>chat_session_index.json</code>、<code>chat_sessions/&lt;id&gt;.json</code>。旧版 App 导出的 ZIP 结构不同，会被拒绝。</div>
<pre id="manifest" hidden></pre>

<script>
(function () {
  "use strict";
  var verdict = document.getElementById("verdict");
  var rows = document.getElementById("rows");
  var manBox = document.getElementById("manifest");
  var input = document.getElementById("f");

  function row(k, v) {
    var tr = document.createElement("tr");
    var a = document.createElement("td"); a.textContent = k;
    var b = document.createElement("td"); b.textContent = v;
    tr.appendChild(a); tr.appendChild(b);
    rows.appendChild(tr);
  }

  function say(text, cls) {
    verdict.className = "verdict " + (cls || "");
    verdict.textContent = text;
  }

  function u16(dv, o) { return dv.getUint16(o, true); }
  function u32(dv, o) { return dv.getUint32(o, true); }

  function findEOCD(dv, len) {
    var max = Math.min(len, 66000);
    for (var i = len - 22; i >= len - max && i >= 0; i--) {
      if (u32(dv, i) === 0x06054b50) return i;
    }
    return -1;
  }

  function readEntries(buf) {
    var dv = new DataView(buf);
    var len = buf.byteLength;
    var eocd = findEOCD(dv, len);
    if (eocd < 0) throw new Error("不是 ZIP（找不到中央目录）");
    var count = u16(dv, eocd + 10);
    var cdOffset = u32(dv, eocd + 16);
    var entries = [];
    var p = cdOffset;
    for (var i = 0; i < count; i++) {
      if (u32(dv, p) !== 0x02014b50) break;
      var method = u16(dv, p + 10);
      var csize = u32(dv, p + 20);
      var usize = u32(dv, p + 24);
      var nameLen = u16(dv, p + 28);
      var extraLen = u16(dv, p + 30);
      var commentLen = u16(dv, p + 32);
      var localOff = u32(dv, p + 42);
      var name = new TextDecoder("utf-8").decode(new Uint8Array(buf, p + 46, nameLen));
      entries.push({ name: name, method: method, csize: csize, usize: usize, localOff: localOff });
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  function readFileData(buf, entry) {
    var dv = new DataView(buf);
    var p = entry.localOff;
    if (u32(dv, p) !== 0x04034b50) return Promise.reject(new Error("本地头损坏: " + entry.name));
    var nameLen = u16(dv, p + 26);
    var extraLen = u16(dv, p + 28);
    var start = p + 30 + nameLen + extraLen;
    var raw = buf.slice(start, start + entry.csize);
    if (entry.method === 0) return Promise.resolve(raw);
    if (typeof DecompressionStream === "undefined") {
      return Promise.reject(new Error("这个 WebView 不支持 DecompressionStream，无法解压"));
    }
    var ds = new DecompressionStream("deflate-raw");
    var stream = new Blob([raw]).stream().pipeThrough(ds);
    return new Response(stream).arrayBuffer();
  }

  input.addEventListener("change", function () {
    var file = input.files && input.files[0];
    if (!file) return;
    rows.innerHTML = "";
    manBox.hidden = true;
    say("解析中…");

    row("文件名", file.name);
    row("大小", (file.size / 1024).toFixed(1) + " KB");

    file.arrayBuffer().then(function (buf) {
      var entries;
      try {
        entries = readEntries(buf);
      } catch (e) {
        say("这个文件不是有效的 ZIP：" + e.message, "bad");
        return;
      }
      row("条目数", String(entries.length));

      var names = entries.map(function (e) { return e.name; });
      var hasManifest = names.indexOf("manifest.json") >= 0;
      var hasUser = names.indexOf("user.json") >= 0;
      var hasIndex = names.indexOf("chat_session_index.json") >= 0;
      var sessions = names.filter(function (n) { return /^chat_sessions\/[^/]+\.json$/.test(n); });

      row("manifest.json", hasManifest ? "有" : "缺失");
      row("user.json", hasUser ? "有" : "缺失");
      row("chat_session_index.json", hasIndex ? "有" : "缺失");
      row("chat_sessions/*.json", sessions.length + " 个");

      if (!hasManifest) {
        say("不兼容。\n这个 ZIP 里没有 manifest.json —— 说明它不是 DeepSeek 的新版导出格式。\n" +
            "demo 只认 manifest.json + chat_sessions/ 这种结构，旧格式无法导入。", "bad");
        manBox.hidden = false;
        manBox.textContent = "前 20 个条目：\n" + names.slice(0, 20).join("\n");
        return;
      }

      var man = entries.filter(function (e) { return e.name === "manifest.json"; })[0];
      readFileData(buf, man).then(function (data) {
        var text = new TextDecoder("utf-8").decode(data);
        var json = null;
        try { json = JSON.parse(text); } catch (e) {}
        manBox.hidden = false;
        manBox.textContent = text.slice(0, 2000);

        var ver = json && json.export_format_version;
        row("export_format_version", String(ver));

        if (ver === 3) {
          say("格式对上了（export_format_version = 3）。\n" +
              "如果 App 里仍然导入失败，问题不在 ZIP，而在文件读取——\n" +
              "确认 App 是这一版（已放开 content:// 访问）。", "ok");
        } else if (ver === undefined) {
          say("manifest.json 里没有 export_format_version，可能不是官方导出文件。", "warn");
        } else {
          say("版本不匹配：这个 ZIP 是 v" + ver + "，demo 只支持 v3。\n" +
              "请用最新版 DeepSeek App 重新导出。", "bad");
        }
      }).catch(function (e) {
        say("解压 manifest.json 失败：" + e.message, "warn");
      });
    }).catch(function (e) {
      say("读取文件失败：" + e.message, "bad");
    });
  });
})();
</script>
</body>
</html>
